<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración - Participantes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="contenedor" id="login-box">
    <h1>Administración</h1>
    <p class="sub">Ingresá la clave para ver los participantes.</p>
    <div class="card">
      <form id="login">
        <label for="clave">Clave</label>
        <input id="clave" type="password" autocomplete="current-password" required>
        <div id="login-msg" class="mensaje error oculto"></div>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div class="contenedor ancho oculto" id="panel">
    <h1>Participantes registrados</h1>
    <p class="sub" id="total"></p>

    <div class="card">
      <div class="resumen" id="resumen"></div>

      <div class="grupos">
        <h2>Puestos de asistencia</h2>
        <div class="grupos-form">
          <div class="campo">
            <label for="tamano">Personas por puesto</label>
            <input id="tamano" type="number" min="1" max="500" value="10">
          </div>
          <div class="campo">
            <label for="modo">Cómo repartir</label>
            <select id="modo">
              <option value="orden">Por orden de inscripción</option>
              <option value="aleatorio">Al azar</option>
            </select>
          </div>
          <button id="crear-grupos">Crear grupos</button>
          <button id="borrar-grupos" class="secundario">Borrar asignación</button>
        </div>
        <p class="grupos-estado" id="grupos-estado"></p>
        <div class="resumen" id="resumen-puestos"></div>
      </div>


      <div class="barra">
        <input id="buscar" type="search" placeholder="Buscar por cédula, nombre o teléfono…">
        <select id="filtro-puesto" class="filtro"><option value="">Todos los puestos</option></select>
        <button id="csv">⬇ Descargar CSV (Excel)</button>
        <button id="refrescar" class="secundario">↻ Actualizar</button>
        <button id="salir" class="secundario">Salir</button>
      </div>

      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Cédula</th><th>Nombre completo</th><th>Teléfono</th>
              <th>Talla</th><th>Puesto</th><th>Fecha</th><th></th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
